<!doctype html>
<title>Bücherkarte</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Eine zoombare Bibliothek: Genres, Subgenres, Themen und Bücher in Ebenen, jede Ebene beschreibt, was beim nächsten Zoom kommt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <div class="stage" id="stage" tabindex="0" aria-label="Zoombare Bibliothek. Ziehen zum Verschieben, Mausrad oder Plus und Minus zum Zoomen, Klick auf einen Bereich zoomt hinein."></div>

  <header class="top">
    <div class="searchcard" id="searchcard">
      <div class="searchrow">
        <span class="brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="4" height="16" rx="1" fill="var(--accent)"/><rect x="8.5" y="4" width="4" height="16" rx="1" fill="var(--accent)" opacity=".7"/><rect x="14" y="5" width="4" height="15" rx="1" transform="rotate(-12 16 12.5)" fill="var(--accent)" opacity=".45"/></svg>
        </span>
        <label class="sr" for="q">Suche</label>
        <input id="q" type="search" placeholder="Buch, Autor·in, Genre oder Thema suchen" autocomplete="off" spellcheck="false">
      </div>
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Aktuelle Ebene"></nav>
  </header>

  <aside class="panel" id="panel" hidden aria-live="polite"></aside>

  <div class="controls" role="group" aria-label="Zoom">
    <div class="zoomgroup">
      <button class="ctl" id="zoomIn" type="button" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
      <div class="levels" id="levels" role="group" aria-label="Abstraktionsebene">
        <button class="stop" type="button" data-level="4" aria-label="Ebene Details"><i></i><span>Details</span></button>
        <button class="stop" type="button" data-level="3" aria-label="Ebene Bücher"><i></i><span>Bücher</span></button>
        <button class="stop" type="button" data-level="2" aria-label="Ebene Themen"><i></i><span>Themen</span></button>
        <button class="stop" type="button" data-level="1" aria-label="Ebene Subgenres"><i></i><span>Subgenres</span></button>
        <button class="stop" type="button" data-level="0" aria-label="Ebene Genres"><i></i><span>Genres</span></button>
      </div>
      <button class="ctl" id="zoomOut" type="button" title="Herauszoomen" aria-label="Herauszoomen">−</button>
    </div>
    <button class="ctl" id="homeBtn" type="button" title="Ganze Bibliothek zeigen" aria-label="Ganze Bibliothek zeigen">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h8v8h-8zm2 2v4h4v-4z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="randomBtn" type="button" title="Zufälliges Buch" aria-label="Zufälliges Buch">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4l-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="data.js"></script>
<script src="covers/manifest.js"></script>
<script src="app.js"></script>
