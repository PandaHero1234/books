<!doctype html>
<title>Bücherkarte</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Eine Weltkarte der Bücher: Genres als Kontinente, Bücher als Orte, mit Suche und Lese-Routen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <canvas id="map" tabindex="0" aria-label="Karte der Bücherwelt. Ziehen zum Verschieben, Mausrad oder Plus und Minus zum Zoomen."></canvas>

  <header class="top">
    <div class="searchcard" id="searchcard">
      <div class="searchrow" id="searchrow">
        <span class="brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2C8 2 5 5 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-4-3-7-7-7z" fill="var(--pin)"/><path d="M8.6 7.2h2.6c.5 0 .8.2.8.6v4.6c-.3-.3-.6-.4-1-.4H8.6zM15.4 7.2h-2.6c-.5 0-.8.2-.8.6v4.6c.3-.3.6-.4 1-.4h2.4z" fill="var(--pin-ink)"/></svg>
        </span>
        <label class="sr" for="q">Suche</label>
        <input id="q" type="search" placeholder="Buch, Autor·in, Genre oder Thema suchen" autocomplete="off" spellcheck="false">
        <button class="iconbtn" id="routeBtn" type="button" title="Lese-Route planen" aria-label="Lese-Route planen" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21.7 11.3l-9-9a1 1 0 00-1.4 0l-9 9a1 1 0 000 1.4l9 9a1 1 0 001.4 0l9-9a1 1 0 000-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 011-1h5V7.5l3.5 3.5z" fill="currentColor"/></svg>
        </button>
      </div>
      <form class="routeform" id="routeform" hidden autocomplete="off">
        <div class="routefields">
          <div class="rf"><span class="dot dot-a" aria-hidden="true"></span><label class="sr" for="from">Start</label><input id="from" placeholder="Startbuch wählen"></div>
          <div class="rf"><span class="dot dot-b" aria-hidden="true"></span><label class="sr" for="to">Ziel</label><input id="to" placeholder="Zielbuch wählen"></div>
        </div>
        <div class="routeside">
          <button class="iconbtn" id="swapBtn" type="button" title="Start und Ziel tauschen" aria-label="Start und Ziel tauschen">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99zM9 3L5 6.99h3V14h2V6.99h3z" fill="currentColor"/></svg>
          </button>
          <button class="iconbtn" id="closeRoute" type="button" title="Routenplaner schließen" aria-label="Routenplaner schließen">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" fill="currentColor"/></svg>
          </button>
        </div>
      </form>
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <nav class="chips" id="chips" aria-label="Kontinente"></nav>
  </header>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <div class="controls" role="group" aria-label="Kartensteuerung">
    <div class="zoomgroup">
      <button class="ctl" id="zoomIn" type="button" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
      <div class="levels" id="levels" role="group" aria-label="Detailstufe">
        <button class="stop" type="button" data-level="3" aria-label="Stufe Bücher"><i></i><span>Bücher</span></button>
        <button class="stop" type="button" data-level="2" aria-label="Stufe Themen"><i></i><span>Themen</span></button>
        <button class="stop" type="button" data-level="1" aria-label="Stufe Regionen"><i></i><span>Regionen</span></button>
        <button class="stop" type="button" data-level="0" aria-label="Stufe Kontinente"><i></i><span>Kontinente</span></button>
      </div>
      <button class="ctl" id="zoomOut" type="button" title="Herauszoomen" aria-label="Herauszoomen">−</button>
    </div>
    <button class="ctl" id="worldBtn" type="button" title="Ganze Welt zeigen" aria-label="Ganze Welt zeigen">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-3a15.7 15.7 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 010-4h3.4a16.5 16.5 0 000 4zm.8 2h3a15.7 15.7 0 001.4 3.6A8 8 0 015.1 16zm3-8h-3a8 8 0 014.3-3.6C8.8 5.5 8.4 6.7 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 010-4h4.6a14.7 14.7 0 010 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 01-4.4 3.6zm1.7-5.6a16.5 16.5 0 000-4h3.4a8.2 8.2 0 010 4z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="randomBtn" type="button" title="Zufälliges Buch" aria-label="Zufälliges Buch">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4l-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="ferryBtn" type="button" title="Fährlinien zwischen Genres ein- oder ausblenden" aria-label="Fährlinien ein- oder ausblenden" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 21c-1.4 0-2.8-.5-4-1.3-2.4 1.7-5.6 1.7-8 0-1.2.8-2.6 1.3-4 1.3H2v2h2c1.4 0 2.7-.3 4-1 2.5 1.3 5.5 1.3 8 0 1.3.7 2.6 1 4 1h2v-2zM3.9 19H4c1.6 0 3-.9 4-2 1 1.1 2.4 2 4 2s3-.9 4-2c1 1.1 2.4 2 4 2h.1l1.9-6.7c.1-.3.1-.5 0-.7-.1-.3-.3-.4-.6-.5L20 10.6V6a2 2 0 00-2-2h-3V1H9v3H6a2 2 0 00-2 2v4.6l-1.3.4c-.3.1-.5.3-.6.5-.1.2-.1.4 0 .7zM6 6h12v4l-6-2-6 2z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="scale" id="scale" aria-hidden="true"><span id="scaleLabel">200 Lese-km</span><i id="scaleBar"></i></div>
  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
